<style>

  :root{
    --bg:#0E0F12;
    --bg-alt:#1A1B1F;
    --ink:#F2F1EC;
    --ink-soft:#9A9CA3;
    --line:#2A2C31;
    --line-strong:#44474E;
    --accent:#5B84FF;
    --accent-soft:rgba(91,132,255,0.12);
    --gap:clamp(1.25rem, 3vw, 2.5rem);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:'Space Grotesk', sans-serif; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  .mono{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:0 var(--gap);
  }

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(14,15,18,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem var(--gap);
    max-width:1200px;
    margin:0 auto;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.02em;
  }
  .logo span{ color:var(--accent); }
  .nav-right{
    display:flex;
    align-items:center;
    gap:1.8rem;
  }
  .home-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px; height:30px;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    border-radius:50%;
    transition:color 0.2s ease, border-color 0.2s ease;
    flex:0 0 auto;
  }
  .home-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .home-btn svg{ width:15px; height:15px; }
  .nav-links{
    display:flex;
    gap:2rem;
    list-style:none;
    margin:0; padding:0;
  }
  .nav-links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    transition:color 0.2s ease;
    position:relative;
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a::after{
    content:"";
    position:absolute; left:0; bottom:-3px;
    width:0; height:1px;
    background:var(--accent);
    transition:width 0.25s ease;
  }
  .nav-links a:hover::after{ width:100%; }
  @media (max-width:480px){
    .nav-links{ display:none; }
  }

  .project-hero{
    padding:clamp(3rem, 7vw, 5rem) 0 clamp(2rem, 5vw, 3rem);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:0.6em;
    margin-bottom:1rem;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background:var(--accent);
    display:inline-block;
    border-radius:1px;
  }
  .project-hero h1{
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    margin-bottom:0.8rem;
  }
  .project-hero p{
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:56ch;
  }

  /* ---------- SLIDE VIEWER ---------- */
  .pass-section{
    padding-bottom:clamp(3rem, 7vw, 5rem);
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
  }
  .pass-viewer{
    position:relative;
    width:100%;
    height:70vh;
    margin:0 auto;
    background:#000;
    border-top:1px solid var(--line-strong);
    border-bottom:1px solid var(--line-strong);
    overflow:hidden;
    cursor:ew-resize;
    user-select:none;
    touch-action:pan-y;
  }
  @media (max-width:700px){
    .pass-viewer{ height:42vh; }
  }
  .pass-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
    z-index:1;
  }
  .pass-img.is-active{ opacity:1; pointer-events:auto; z-index:2; }
  .pass-count{
    position:absolute;
    top:14px; right:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:var(--ink);
    background:rgba(14,15,18,0.55);
    padding:0.35em 0.7em;
    border-radius:3px;
    backdrop-filter:blur(4px);
    z-index:3;
  }
  .pass-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:3;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid rgba(242,241,236,0.25);
    background:rgba(255,255,255,0.08);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .pass-nav:hover{ background:rgba(255,255,255,0.18); border-color:var(--accent); }
  .pass-nav svg{ width:14px; height:14px; }
  .pass-nav.prev{ left:12px; }
  .pass-nav.next{ right:12px; }
  .pass-progress{
    position:relative;
    height:4px;
    margin:1rem var(--gap) 0;
    background:var(--line-strong);
    border-radius:2px;
    cursor:pointer;
  }
  .pass-progress-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:0.7%;
    background:var(--accent);
    border-radius:2px;
    transition:width 0.3s ease;
  }

  footer{
    border-top:1px solid var(--line);
    padding:1.6rem var(--gap);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    text-align:center;
  }

</style>

<script>
  // Slide viewer — click arrows, drag the progress bar, swipe, hover-scrub, or use
  // arrow keys to move through the deck. Images lazy-load: only the current slide
  // plus its immediate neighbors are fetched, so a 150-page deck doesn't load
  // 150 images up front.
  (function(){
    var stage = document.getElementById('passViewer');
    if(!stage) return;
    var slides = Array.prototype.slice.call(stage.querySelectorAll('.pass-img'));
    var count = document.getElementById('passCount');
    var prevBtn = document.getElementById('passPrev');
    var nextBtn = document.getElementById('passNext');
    var progress = document.getElementById('passProgress');
    var progressFill = document.getElementById('passProgressFill');
    var total = slides.length;
    var current = 0;

    function loadSlide(i){
      if(i < 0 || i >= total) return;
      var img = slides[i];
      if(!img.src && img.dataset.src){ img.src = img.dataset.src; }
    }

    function show(i){
      var newIdx = (i + total) % total;
      if(newIdx === current){ return; }
      var prevIdx = current;
      current = newIdx;

      loadSlide(current);
      loadSlide(current - 1);
      loadSlide(current + 1);

      // Layer the incoming slide on top and fade it in; the outgoing slide
      // stays fully opaque underneath so the black stage background never shows through.
      slides[current].classList.add('is-active');
      window.setTimeout(function(){
        if(prevIdx !== current){
          slides[prevIdx].classList.remove('is-active');
        }
      }, 550);

      count.textContent = String(current+1).padStart(3,'0') + ' / ' + String(total).padStart(3,'0');
      progressFill.style.width = (((current+1) / total) * 100) + '%';
    }

    function next(){ show(current + 1); }
    function prev(){ show(current - 1); }

    // Preload the second slide right away so the first "next" click is instant.
    loadSlide(1);

    if(nextBtn) nextBtn.addEventListener('click', next);
    if(prevBtn) prevBtn.addEventListener('click', prev);

    document.addEventListener('keydown', function(e){
      var rect = stage.getBoundingClientRect();
      if(rect.bottom < 0 || rect.top > window.innerHeight) return; // only when viewer is on screen
      if(e.key === 'ArrowRight'){ next(); }
      else if(e.key === 'ArrowLeft'){ prev(); }
    });

    var touchStartX = null;
    stage.addEventListener('touchstart', function(e){ touchStartX = e.changedTouches[0].clientX; }, { passive:true });
    stage.addEventListener('touchend', function(e){
      if(touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      if(dx > 40) prev();
      else if(dx < -40) next();
      touchStartX = null;
    }, { passive:true });
    stage.addEventListener('touchcancel', function(){ touchStartX = null; }, { passive:true });

    // Hover follow — moving the mouse across the viewer scrubs through the deck live.
    stage.addEventListener('mousemove', function(e){
      var rect = stage.getBoundingClientRect();
      var relX = (e.clientX - rect.left) / rect.width;
      relX = Math.min(Math.max(relX, 0), 0.999);
      var idx = Math.floor(relX * total);
      if(idx !== current) show(idx);
    });

    // Click/drag the progress bar to jump to any point in the deck.
    function seekFromEvent(e){
      var rect = progress.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var relX = (clientX - rect.left) / rect.width;
      relX = Math.min(Math.max(relX, 0), 0.999);
      show(Math.floor(relX * total));
    }
    var isSeeking = false;
    progress.addEventListener('mousedown', function(e){ isSeeking = true; seekFromEvent(e); });
    window.addEventListener('mousemove', function(e){ if(isSeeking) seekFromEvent(e); });
    window.addEventListener('mouseup', function(){ isSeeking = false; });
    progress.addEventListener('touchstart', function(e){ seekFromEvent(e); }, { passive:true });
    progress.addEventListener('touchmove', function(e){ seekFromEvent(e); }, { passive:true });
  })();
</script>
