<style>
  :root{
    --bg:#0E0F12;
    --bg-alt:#1A1B1F;
    --ink:#F2F1EC;
    --ink-soft:#9A9CA3;
    --line:#2A2C31;

    position:sticky; top:0; z-index:50;
    background:rgba(14,15,18,0.85);

    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem var(--gap);

  .logo{

    font-size:1rem;
    letter-spacing:0.02em;
  }
  .logo span{ color:var(--accent); }
  .nav-right{ display:flex; align-items:center; gap:1.8rem; }
  .home-btn{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    border-radius:50%;
    transition:color 0.2s ease, border-color 0.2s ease;
    flex:0 0 auto;
  }
  .home-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .home-btn svg{ width:15px; height:15px; }
  .nav-links{
    display:flex;
    gap:2rem;
    list-style:none;
    margin:0; padding:0;
  }
  .nav-links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    transition:color 0.2s ease;
    position:relative;
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a::after{
    content:"";
    position:absolute; left:0; bottom:-3px;
    width:0; height:1px;
    background:var(--accent);
    transition:width 0.25s ease;
  }
  .nav-links a:hover::after{ width:100%; }

  .nav-toggle{
    display:none;
    align-items:center;
    justify-content:center;
    width:30px; height:30px;
    padding:0;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line-strong);
    border-radius:50%;
    cursor:pointer;
    flex:0 0 auto;
  }
  .nav-toggle:hover,
  .nav-toggle[aria-expanded="true"]{ color:var(--accent); border-color:var(--accent); }
  .nav-toggle:focus-visible,
  .nav-links a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }
  .nav-toggle svg{ width:15px; height:15px; display:block; }
  .nav-toggle .icon-close{ display:none; }
  .nav-toggle[aria-expanded="true"] .icon-menu{ display:none; }
  .nav-toggle[aria-expanded="true"] .icon-close{ display:block; }
  @media (max-width:960px){
    .nav-right{ gap:0.8rem; }
    .nav-links{ gap:0.7rem 1rem; flex-wrap:wrap; justify-content:flex-end; }
  }
  @media (max-width:480px){
    /* backdrop-filter on the header would clip a menu that hangs out of it */
    header{
      background:#0E0F12;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
    }
    nav{ position:static; }
    .nav-toggle{ display:flex; }
    .nav-links{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:0;
      flex-direction:column;
      flex-wrap:nowrap;
      gap:0;
      margin:0;
      padding:0.35rem 0 0.85rem;
      background:#0E0F12;
      border-bottom:1px solid var(--line);
      z-index:60;
    }
    .nav-links.is-open{ display:flex; }
    .nav-links a{
      display:block;
      padding:0.85rem var(--gap);
      color:var(--ink);
    }
    .nav-links a::after{ display:none; }
  }

  .project-hero{ padding:clamp(3rem, 7vw, 5rem) 0 clamp(2rem, 5vw, 3rem); }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:0.6em;
    margin-bottom:1rem;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background:var(--accent);
    display:inline-block;
    border-radius:1px;
  }
  .project-hero h1{
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    margin-bottom:0.8rem;
  }
  .project-hero p{
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:46ch;
  }
  .cv-link{
    display:inline-flex;
    align-items:center;
    margin-top:1.4rem;
    padding:0.7rem 1rem;
    border:1px solid var(--line-strong);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .cv-link:hover{ color:var(--accent); border-color:var(--accent); }
  footer{

    flex-wrap:wrap;
    gap:1.4rem;
  }
