<style>

  :root{
    --bg:#0E0F12;
    --bg-alt:#1A1B1F;
    --ink:#F2F1EC;
    --ink-soft:#9A9CA3;
    --line:#2A2C31;
    --line-strong:#44474E;
    --accent:#5B84FF;
    --accent-soft:rgba(91,132,255,0.12);
    --gap:clamp(1.25rem, 3vw, 2.5rem);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:'Space Grotesk', sans-serif; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  .mono{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:0 var(--gap);
  }

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(14,15,18,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem var(--gap);
    max-width:1200px;
    margin:0 auto;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.02em;
  }
  .logo span{ color:var(--accent); }
  .nav-right{
    display:flex;
    align-items:center;
    gap:1.8rem;
  }
  .home-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px; height:30px;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    border-radius:50%;
    transition:color 0.2s ease, border-color 0.2s ease;
    flex:0 0 auto;
  }
  .home-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .home-btn svg{ width:15px; height:15px; }
  .nav-links{
    display:flex;
    gap:2rem;
    list-style:none;
    margin:0; padding:0;
  }
  .nav-links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    transition:color 0.2s ease;
    position:relative;
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a::after{
    content:"";
    position:absolute; left:0; bottom:-3px;
    width:0; height:1px;
    background:var(--accent);
    transition:width 0.25s ease;
  }
  .nav-links a:hover::after{ width:100%; }

  .nav-toggle{
    display:none;
    align-items:center;
    justify-content:center;
    width:30px; height:30px;
    padding:0;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line-strong);
    border-radius:50%;
    cursor:pointer;
    flex:0 0 auto;
  }
  .nav-toggle:hover,
  .nav-toggle[aria-expanded="true"]{ color:var(--accent); border-color:var(--accent); }
  .nav-toggle:focus-visible,
  .nav-links a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }
  .nav-toggle svg{ width:15px; height:15px; display:block; }
  .nav-toggle .icon-close{ display:none; }
  .nav-toggle[aria-expanded="true"] .icon-menu{ display:none; }
  .nav-toggle[aria-expanded="true"] .icon-close{ display:block; }
  @media (max-width:960px){
    .nav-right{ gap:0.8rem; }
    .nav-links{ gap:0.7rem 1rem; flex-wrap:wrap; justify-content:flex-end; }
  }
  @media (max-width:480px){
    /* backdrop-filter on the header would clip a menu that hangs out of it */
    header{
      background:#0E0F12;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
    }
    nav{ position:static; }
    .nav-toggle{ display:flex; }
    .nav-links{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:0;
      flex-direction:column;
      flex-wrap:nowrap;
      gap:0;
      margin:0;
      padding:0.35rem 0 0.85rem;
      background:#0E0F12;
      border-bottom:1px solid var(--line);
      z-index:60;
    }
    .nav-links.is-open{ display:flex; }
    .nav-links a{
      display:block;
      padding:0.85rem var(--gap);
      color:var(--ink);
    }
    .nav-links a::after{ display:none; }
  }

  .project-hero{
    padding:clamp(3rem, 7vw, 5rem) 0 clamp(2rem, 5vw, 3rem);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:0.6em;
    margin-bottom:1rem;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background:var(--accent);
    display:inline-block;
    border-radius:1px;
  }
  .project-hero h1{
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    margin-bottom:0.8rem;
  }
  .project-hero p{
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:56ch;
  }

  .deck-section{
    padding-bottom:clamp(3rem, 7vw, 5rem);
    display:flex;
    flex-direction:column;
    gap:1.6rem;
    width:150%;
    max-width:min(1500px, 96vw);
    position:relative;
    left:50%;
    transform:translateX(-50%);
  }
  @media (max-width:900px){
    .deck-section{ width:100%; max-width:100%; left:0; transform:none; }
  }
  .deck-embed{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    height:0;
    overflow:hidden;
    border:1px solid var(--line-strong);
    background:var(--bg-alt);
    border-radius:6px;
    box-sizing:border-box;
  }
  .deck-embed iframe{
    position:absolute;
    top:12px; left:12px; right:12px; bottom:12px;
    width:calc(100% - 24px);
    height:calc(100% - 24px);
    border:0;
    border-radius:4px;
  }
  @media (max-width:600px){
    .deck-embed iframe{ top:8px; left:8px; right:8px; bottom:8px; width:calc(100% - 16px); height:calc(100% - 16px); }
  }

  /* Minimal click-to-play facade — replaces YouTube's own thumbnail/play button/title chrome */
  .yt-facade{
    position:absolute;
    top:12px; left:12px; right:12px; bottom:12px;
    width:calc(100% - 24px);
    height:calc(100% - 24px);
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
    background:#000;
  }
  @media (max-width:600px){
    .yt-facade{ top:8px; left:8px; right:8px; bottom:8px; width:calc(100% - 16px); height:calc(100% - 16px); }
  }
  .yt-facade img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .yt-facade-play{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:56px; height:56px;
    border-radius:50%;
    background:rgba(14,15,18,0.55);
    border:1.5px solid rgba(242,241,236,0.8);
    display:flex; align-items:center; justify-content:center;
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .yt-facade-play svg{ width:18px; height:18px; margin-left:2px; }
  .yt-facade:hover .yt-facade-play{
    background:var(--accent);
    border-color:var(--accent);
    transform:translate(-50%,-50%) scale(1.06);
  }

  footer{
    border-top:1px solid var(--line);
    padding:1.6rem var(--gap);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    text-align:center;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:1.4rem;
  }
  footer .footer-cv{ color:var(--accent); }
  footer .footer-cv:hover{ color:var(--ink); }

</style>

<script>
  // Minimal click-to-play facade for YouTube embeds — swaps our own thumbnail +
  // play button for the real iframe only once clicked, so none of YouTube's own
  // branded play button, title, or channel overlay ever shows.
  (function(){
    function loadVideo(facade){
      var id = facade.getAttribute('data-yt-id');
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1';
      iframe.title = facade.getAttribute('aria-label') || 'YouTube video';
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.style.position = 'absolute';
      iframe.style.inset = '0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = '0';
      iframe.style.borderRadius = '4px';
      facade.parentNode.replaceChild(iframe, facade);
    }
    document.querySelectorAll('.yt-facade').forEach(function(facade){
      facade.addEventListener('click', function(){ loadVideo(facade); });
      facade.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); loadVideo(facade); }
      });
    });
  })();
</script>
