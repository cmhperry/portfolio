<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom Blade Zero | Perry Chu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#0E0F12;
    --bg-alt:#1A1B1F;
    --ink:#F2F1EC;
    --ink-soft:#9A9CA3;
    --line:#2A2C31;
    --line-strong:#44474E;
    --accent:#5B84FF;
    --accent-soft:rgba(91,132,255,0.12);
    --gap:clamp(1.25rem, 3vw, 2.5rem);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:'Space Grotesk', sans-serif; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  .mono{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:0 var(--gap);
  }

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(14,15,18,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem var(--gap);
    max-width:1200px;
    margin:0 auto;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.02em;
  }
  .logo span{ color:var(--accent); }
  .nav-right{
    display:flex;
    align-items:center;
    gap:1.8rem;
  }
  .home-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px; height:30px;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    border-radius:50%;
    transition:color 0.2s ease, border-color 0.2s ease;
    flex:0 0 auto;
  }
  .home-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .home-btn svg{ width:15px; height:15px; }
  .nav-links{
    display:flex;
    gap:2rem;
    list-style:none;
    margin:0; padding:0;
  }
  .nav-links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    transition:color 0.2s ease;
    position:relative;
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a::after{
    content:"";
    position:absolute; left:0; bottom:-3px;
    width:0; height:1px;
    background:var(--accent);
    transition:width 0.25s ease;
  }
  .nav-links a:hover::after{ width:100%; }
  @media (max-width:480px){
    .nav-links{ display:none; }
  }

  .project-hero{
    padding:clamp(3rem, 7vw, 5rem) 0 clamp(2rem, 5vw, 3rem);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:0.6em;
    margin-bottom:1rem;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background:var(--accent);
    display:inline-block;
    border-radius:1px;
  }
  .project-hero h1{
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    margin-bottom:0.8rem;
  }
  .project-hero p{
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:56ch;
  }

  .deck-section{ padding-bottom:clamp(3rem, 7vw, 5rem); }

  /* ---------- PASS VIEWER ---------- */
  .pass-section{ padding-bottom:clamp(3rem, 7vw, 5rem); }
  .pass-viewer{
    position:relative;
    max-width:460px;
    margin:0 auto;
    aspect-ratio:620/1000;
    background:#000;
    border:1px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .pass-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.6s ease;
  }
  .pass-img.is-active{ opacity:1; pointer-events:auto; }
  .pass-label{
    position:absolute;
    top:14px; left:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink);
    z-index:2;
  }
  .pass-count{
    position:absolute;
    top:14px; right:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    z-index:2;
  }
  .pass-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:3;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid rgba(242,241,236,0.25);
    background:rgba(255,255,255,0.08);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background 0.2s ease, border-color 0.2s ease;
  }
  .pass-nav:hover{ background:rgba(255,255,255,0.18); border-color:var(--accent); }
  .pass-nav svg{ width:14px; height:14px; }
  .pass-nav.prev{ left:12px; }
  .pass-nav.next{ right:12px; }
  .pass-dots{
    display:flex;
    justify-content:center;
    gap:0.5rem;
    margin-top:1rem;
  }
  .pass-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--line-strong);
    cursor:pointer;
    transition:background 0.2s ease;
  }
  .pass-dot.is-active{ background:var(--accent); }

  .gallery-section{
    padding-bottom:clamp(3rem, 7vw, 5rem);
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
  }
  .gallery-section-inner{
    max-width:1600px;
    margin:0 auto;
    padding:0 var(--gap);
    display:flex;
    flex-direction:column;
    gap:1.6rem;
  }
  .gallery-frame{
    border:1px solid var(--line-strong);
    background:var(--bg-alt);
    padding:12px;
    border-radius:6px;
  }
  .gallery-frame img{
    display:block;
    width:100%;
    height:auto;
    border-radius:4px;
  }
  .deck-embed{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    height:0;
    overflow:hidden;
    border:1px solid var(--line-strong);
    background:var(--bg-alt);
    border-radius:6px;
    box-sizing:border-box;
  }
  .deck-embed iframe{
    position:absolute;
    top:12px; left:12px; right:12px; bottom:12px;
    width:calc(100% - 24px);
    height:calc(100% - 24px);
    border:0;
    border-radius:4px;
  }
  @media (max-width:600px){
    .deck-embed iframe{ top:8px; left:8px; right:8px; bottom:8px; width:calc(100% - 16px); height:calc(100% - 16px); }
  }

  footer{
    border-top:1px solid var(--line);
    padding:1.6rem var(--gap);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    text-align:center;
  }

</style>
</head>

<script>
  // Texture pass viewer — click arrows, dots, or swipe to cycle through render passes.
  (function(){
    var stage = document.getElementById('passViewer');
    if(!stage) return;
    var slides = Array.prototype.slice.call(stage.querySelectorAll('.pass-img'));
    var label = document.getElementById('passLabel');
    var count = document.getElementById('passCount');
    var prevBtn = document.getElementById('passPrev');
    var nextBtn = document.getElementById('passNext');
    var dotsWrap = document.getElementById('passDots');
    var total = slides.length;
    var current = 0;

    slides.forEach(function(s, idx){
      var dot = document.createElement('span');
      dot.className = 'pass-dot' + (idx === 0 ? ' is-active' : '');
      dot.addEventListener('click', function(){ show(idx); });
      dotsWrap.appendChild(dot);
    });
    var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll('.pass-dot'));

    function show(i){
      current = (i + total) % total;
      slides.forEach(function(s, idx){ s.classList.toggle('is-active', idx === current); });
      dots.forEach(function(d, idx){ d.classList.toggle('is-active', idx === current); });
      label.textContent = slides[current].dataset.label;
      count.textContent = String(current+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
    }

    function next(){ show(current + 1); }
    function prev(){ show(current - 1); }

    if(nextBtn) nextBtn.addEventListener('click', next);
    if(prevBtn) prevBtn.addEventListener('click', prev);

    var touchStartX = null;
    stage.addEventListener('touchstart', function(e){ touchStartX = e.changedTouches[0].clientX; }, { passive:true });
    stage.addEventListener('touchend', function(e){
      if(touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      if(dx > 40) prev();
      else if(dx < -40) next();
      touchStartX = null;
    }, { passive:true });
  })();
</script>
